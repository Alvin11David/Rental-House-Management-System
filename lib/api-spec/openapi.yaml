openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: rental
    description: Rental properties, tenants, payments, and maintenance
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /rental/dashboard:
    get:
      operationId: getRentalDashboard
      tags: [rental]
      summary: Get the rental overview
      responses:
        "200":
          description: Dashboard totals and daily collection status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Dashboard"
  /rental/properties:
    get:
      operationId: getProperties
      tags: [rental]
      summary: List properties
      responses:
        "200":
          description: Properties
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Property"
    post:
      operationId: createProperty
      tags: [rental]
      summary: Create a property
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PropertyInput"
      responses:
        "201":
          description: Property created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Property"
  /rental/units:
    get:
      operationId: getUnits
      tags: [rental]
      summary: List units
      responses:
        "200":
          description: Units and current occupancy
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Unit"
    post:
      operationId: createUnit
      tags: [rental]
      summary: Add a unit to a property
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UnitInput"
      responses:
        "201":
          description: Unit created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Unit"
  /rental/units/{id}:
    patch:
      operationId: updateUnit
      tags: [rental]
      summary: Update unit status or tenant assignment
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UnitUpdate"
      responses:
        "200":
          description: Unit updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Unit"
        "404":
          description: Unit not found
  /rental/tenants:
    get:
      operationId: getTenants
      tags: [rental]
      summary: List tenants
      responses:
        "200":
          description: Tenants
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Tenant"
    post:
      operationId: createTenant
      tags: [rental]
      summary: Add a tenant
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TenantInput"
      responses:
        "201":
          description: Tenant created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Tenant"
  /rental/contact-reveals:
    post:
      operationId: createContactReveal
      tags: [rental]
      summary: Record a tenant contact reveal in demo mode
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ContactRevealInput"
      responses:
        "201":
          description: Contact reveal logged
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContactReveal"
        "404":
          description: Tenant not found
  /rental/payments:
    get:
      operationId: getPayments
      tags: [rental]
      summary: List payment ledger entries
      responses:
        "200":
          description: Payments newest first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Payment"
    post:
      operationId: createPayment
      tags: [rental]
      summary: Record a rent payment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PaymentInput"
      responses:
        "201":
          description: Payment recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Payment"
        "409":
          description: A possible duplicate payment was found
  /rental/repairs:
    get:
      operationId: getRepairs
      tags: [rental]
      summary: List repair requests
      responses:
        "200":
          description: Repairs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Repair"
    post:
      operationId: createRepair
      tags: [rental]
      summary: Report a repair
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RepairInput"
      responses:
        "201":
          description: Repair reported
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Repair"
  /rental/repairs/{id}:
    patch:
      operationId: updateRepair
      tags: [rental]
      summary: Update repair progress or cost
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RepairUpdate"
      responses:
        "200":
          description: Repair updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Repair"
        "404":
          description: Repair not found
  /rental/agreements:
    get:
      operationId: getAgreements
      tags: [rental]
      summary: List rental agreements
      responses:
        "200":
          description: Agreements
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Agreement"
  /rental/agreements/{id}/sign:
    post:
      operationId: signAgreement
      tags: [rental]
      summary: Record a tenant's typed agreement acknowledgement
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SignAgreementInput"
      responses:
        "200":
          description: Agreement marked signed with a timestamp
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Agreement"
        "400":
          description: The typed name does not match the tenant on the agreement
        "404":
          description: Agreement not found
  /rental/analytics:
    get:
      operationId: getRentalAnalytics
      tags: [rental]
      summary: Get rent collection trends
      parameters:
        - name: period
          in: query
          required: true
          schema:
            type: string
            enum: [month, year]
      responses:
        "200":
          description: Collection chart points and plain-language insight
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Analytics"
  /rental/activity:
    get:
      operationId: getRentalActivity
      tags: [rental]
      summary: List the latest recorded activity
      responses:
        "200":
          description: Timeline entries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Activity"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    Property:
      type: object
      required: [id, name, address, description, unitCount]
      properties:
        id: { type: integer }
        name: { type: string }
        address: { type: string }
        description: { type: string }
        unitCount: { type: integer }
    PropertyInput:
      type: object
      required: [name, address]
      properties:
        name: { type: string, minLength: 1 }
        address: { type: string, minLength: 1 }
        description: { type: string }
    Unit:
      type: object
      required: [id, propertyId, unitNumber, bedrooms, rentAmount, status, tenantId, tenantName, balance]
      properties:
        id: { type: integer }
        propertyId: { type: integer }
        unitNumber: { type: string }
        bedrooms: { type: integer }
        rentAmount: { type: number }
        status:
          type: string
          enum: [paid, pending, late, vacant, repair]
        tenantId: { type: [integer, "null"] }
        tenantName: { type: [string, "null"] }
        balance: { type: number }
    UnitInput:
      type: object
      required: [propertyId, unitNumber, bedrooms, rentAmount]
      properties:
        propertyId: { type: integer }
        unitNumber: { type: string, minLength: 1 }
        bedrooms: { type: integer, minimum: 0 }
        rentAmount: { type: number, minimum: 0 }
    UnitUpdate:
      type: object
      properties:
        status:
          type: string
          enum: [paid, pending, late, vacant, repair]
        tenantId: { type: [integer, "null"] }
        bedrooms: { type: integer, minimum: 0 }
        rentAmount: { type: number, minimum: 0 }
    Tenant:
      type: object
      required: [id, fullName, phone, unitId, unitNumber, agreementStart, agreementEnd, openRequests, balance]
      properties:
        id: { type: integer }
        fullName: { type: string }
        phone: { type: string }
        unitId: { type: [integer, "null"] }
        unitNumber: { type: [string, "null"] }
        agreementStart: { type: [string, "null"], format: date }
        agreementEnd: { type: [string, "null"], format: date }
        openRequests: { type: integer }
        balance: { type: number }
    TenantInput:
      type: object
      required: [fullName, phone]
      properties:
        fullName: { type: string, minLength: 1 }
        phone: { type: string, minLength: 7 }
        unitId: { type: [integer, "null"] }
        agreementStart: { type: [string, "null"], format: date }
        agreementEnd: { type: [string, "null"], format: date }
        monthlyRent: { type: number, minimum: 0 }
        deposit: { type: number, minimum: 0 }
    ContactRevealInput:
      type: object
      required: [tenantId, actorRole]
      properties:
        tenantId: { type: integer }
        actorRole:
          type: string
          enum: [Landlord, Caretaker, Tenant]
    ContactReveal:
      type: object
      required: [id, tenantId, unitId, actorRole, occurredAt]
      properties:
        id: { type: integer }
        tenantId: { type: integer }
        unitId: { type: [integer, "null"] }
        actorRole:
          type: string
          enum: [Landlord, Caretaker, Tenant]
        occurredAt: { type: string, format: date-time }
    Payment:
      type: object
      required: [id, unitId, unitNumber, tenantName, amount, method, status, recordedBy, recordedAt, reference]
      properties:
        id: { type: integer }
        unitId: { type: integer }
        unitNumber: { type: string }
        tenantName: { type: string }
        amount: { type: number }
        method:
          type: string
          enum: [mobile_money, cash, bank]
        status:
          type: string
          enum: [paid, pending]
        recordedBy: { type: string }
        recordedAt: { type: string, format: date-time }
        reference: { type: [string, "null"] }
    PaymentInput:
      type: object
      required: [unitId, amount, method, recordedBy]
      properties:
        unitId: { type: integer }
        amount: { type: number, minimum: 1 }
        method:
          type: string
          enum: [mobile_money, cash, bank]
        recordedBy: { type: string, minLength: 1 }
        reference: { type: string }
        confirmDuplicate:
          type: boolean
          description: Explicitly confirm recording a payment that matches a recent entry for the same unit and amount.
    Repair:
      type: object
      required: [id, unitId, unitNumber, tenantName, title, description, status, cost, reportedAt, assignedTo]
      properties:
        id: { type: integer }
        unitId: { type: integer }
        unitNumber: { type: string }
        tenantName: { type: string }
        title: { type: string }
        description: { type: string }
        status:
          type: string
          enum: [reported, assigned, in_progress, done]
        cost: { type: [number, "null"] }
        reportedAt: { type: string, format: date-time }
        assignedTo: { type: [string, "null"] }
    RepairInput:
      type: object
      required: [unitId, title, description]
      properties:
        unitId: { type: integer }
        title: { type: string, minLength: 1 }
        description: { type: string }
        tenantName: { type: string }
    RepairUpdate:
      type: object
      properties:
        status:
          type: string
          enum: [reported, assigned, in_progress, done]
        cost: { type: [number, "null"], minimum: 0 }
        assignedTo: { type: [string, "null"] }
    Agreement:
      type: object
      required: [id, tenantName, unitNumber, monthlyRent, deposit, startDate, endDate, nextDueDate, signedAt]
      properties:
        id: { type: integer }
        tenantName: { type: string }
        unitNumber: { type: string }
        monthlyRent: { type: number }
        deposit: { type: number }
        startDate: { type: string, format: date }
        endDate: { type: string, format: date }
        nextDueDate: { type: string, format: date }
        signedAt: { type: [string, "null"], format: date-time }
    SignAgreementInput:
      type: object
      required: [signerName]
      properties:
        signerName: { type: string, minLength: 2, maxLength: 80 }
    Activity:
      type: object
      required: [id, unitId, unitNumber, title, detail, actor, type, occurredAt]
      properties:
        id: { type: integer }
        unitId: { type: integer }
        unitNumber: { type: string }
        title: { type: string }
        detail: { type: string }
        actor: { type: string }
        type:
          type: string
          enum: [payment, repair, agreement, message, contact_reveal]
        occurredAt: { type: string, format: date-time }
    Dashboard:
      type: object
      required: [propertyName, totalCollected, outstanding, occupiedUnits, totalUnits, paidToday, trustPercent, lateCount, unresolvedRepairs, unverifiedPayments, units, attention, activity]
      properties:
        propertyName: { type: string }
        totalCollected: { type: number }
        outstanding: { type: number }
        occupiedUnits: { type: integer }
        totalUnits: { type: integer }
        paidToday: { type: integer }
        trustPercent: { type: number }
        lateCount: { type: integer }
        unresolvedRepairs: { type: integer }
        unverifiedPayments: { type: integer }
        units:
          type: array
          items: { $ref: "#/components/schemas/Unit" }
        attention:
          type: array
          items: { type: string }
        activity:
          type: array
          items: { $ref: "#/components/schemas/Activity" }
    AnalyticsPoint:
      type: object
      required: [label, collected, outstanding]
      properties:
        label: { type: string }
        collected: { type: number }
        outstanding: { type: number }
    Analytics:
      type: object
      required: [period, points, insight]
      properties:
        period:
          type: string
          enum: [month, year]
        points:
          type: array
          items: { $ref: "#/components/schemas/AnalyticsPoint" }
        insight: { type: string }

